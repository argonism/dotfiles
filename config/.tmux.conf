# prefix
unbind C-b
set -g prefix C-q

# Send prefix to inner tmux session
bind C-q send-prefix

# vi mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# key binding
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -n C-S-o select-pane -t :.+
bind -n C-S-i select-pane -t :.-

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind 0 kill-pane

bind \\ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

bind r source-file ~/.tmux.conf \; display "Reloaded"
bind -n C-S-j display-popup -E "${HOME}/.zsh/lib/tmux-session-switch.zsh"

# line number
set-option -g base-index 1

# mouse
setw -g mouse on

# status bar
set -g status-fg white
set -g status-bg black

# platform-specific overrides (e.g. .tmux.conf.darwin symlinked by the recipe)
source-file -q ~/.tmux.conf.local

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: save pane contents and nvim sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'nvim mysql codex codex-aarch64-a "~claude" "~2.1"'

# continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# TPM init (must be the last line)
run '~/.tmux/plugins/tpm/tpm'
